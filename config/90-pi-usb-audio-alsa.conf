monitor.alsa.rules = [
  {
    matches = [
      { api.alsa.card.name = "UAC2_Gadget" }
    ]
    actions = {
      update-props = {
        # f_uac2 is an emulated ALSA device backed by USB request queues.
        # Give its clock-domain resampler enough safety margin for Pi 4
        # scheduling jitter while keeping end-to-end latency reasonable.
        api.alsa.headroom = 1024
        api.alsa.period-num = 32
        # A Windows host may start and stop any one of the four USB OUT
        # endpoints. Never let one of those intermittent sources become the
        # graph clock; the continuously clocked physical interface must drive.
        priority.driver = 500
        resample.quality = 4
        session.suspend-timeout-seconds = 0
        node.pause-on-idle = false
      }
    }
  }
]
